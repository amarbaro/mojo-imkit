# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c conda-forge
context:
  version: 0.6.3

package:
  name: "mojo-imkit"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/imkit -o ${{ PREFIX }}/lib/mojo/imkit.mojoc

requirements:
  host:
    - max =26.7.0
  build:
    - max =26.7.0
  run:
    - ${{ pin_compatible('max') }}

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/quickstart.mojo -o quickstart
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-imkit
  license: Apache-2.0
  license_file: LICENSE
  summary: Immediate-mode GUI for Mojo, composed on the GPU
  repository: https://github.com/amarbaro/mojo-imkit

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-imkit
