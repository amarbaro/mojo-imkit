name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: sudo apt-get update -q && sudo apt-get install -yq fonts-dejavu-core fonts-noto-cjk libfreetype6 imagemagick libwebp7 libavif-bin dav1d ffmpeg
      - run: scripts/ci.sh
